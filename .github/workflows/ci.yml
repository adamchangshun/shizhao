name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # Unit tests also render pages using Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:secrets
      - run: pnpm check:licenses
      - run: pnpm build
        env:
          PROVIDER: mock
          ADMIN_TOKEN: ci-token-e2e-2026
          PUBLIC_BASE_URL: http://localhost:6688

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # This fresh job has no production .next output; Playwright owns the dev server.
      - run: pnpm test:e2e --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
