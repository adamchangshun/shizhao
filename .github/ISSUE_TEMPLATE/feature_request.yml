name: 功能建议
description: 提出新功能或改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望实招怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已查看 ROADMAP.md 和现有 issue，没有重复的建议
          required: true
        - label: 这项建议不会让 AI 修改商家确认过的事实
          required: true
