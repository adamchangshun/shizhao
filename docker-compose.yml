# docker compose up        → http://localhost:6688 (Mock model, no keys needed)
# Values come from the shell or ./.env (created by `pnpm bootstrap`); unset ones use the defaults below.
services:
  shizhao:
    build:
      context: .
      args:
        WITH_QA: ${WITH_QA:-false}
    image: shizhao:local
    ports:
      - '6688:6688'
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      PROVIDER: ${PROVIDER:-mock}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:6688}
      # Empty → generated on first start and kept in data/admin-token.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LLM_PROFILE: ${LLM_PROFILE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_TEXT: ${LLM_MODEL_TEXT:-}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
      LLM_PRICE_INPUT_PER_1K: ${LLM_PRICE_INPUT_PER_1K:-0}
      LLM_PRICE_OUTPUT_PER_1K: ${LLM_PRICE_OUTPUT_PER_1K:-0}
      GUARD_API_KEYS: ${GUARD_API_KEYS:-}
      GUARD_KEY_DAILY_LIMIT: ${GUARD_KEY_DAILY_LIMIT:-2000}
      GUARD_TRUST_PROXY: ${GUARD_TRUST_PROXY:-false}
      LONG_IMAGE_ENABLED: ${LONG_IMAGE_ENABLED:-false}
      JOB_STAGE_TIMEOUT_MS: ${JOB_STAGE_TIMEOUT_MS:-60000}
      JOB_TOTAL_TIMEOUT_MS: ${JOB_TOTAL_TIMEOUT_MS:-180000}
    restart: unless-stopped
